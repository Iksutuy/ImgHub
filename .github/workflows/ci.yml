name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消旧的运行，避免排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------- Windows
  test-windows:
    name: 测试（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        # 只 restore 测试项目（dotnet restore 一次只接一个项目）。
        # 不用 `dotnet restore ImgHub.slnx`：那会连带 Android head，
        # 而它需要 `dotnet workload install android`（CI 装它代价很大且本 job 用不到）。
        run: |
          dotnet restore tests/ImgHub.Core.Tests
          dotnet restore tests/ImgHub.Integration.Tests

      # 449 项全部离线（Offline=true + 确定性占位图），不联网、不花钱。
      - name: Core 单元测试
        run: dotnet test tests/ImgHub.Core.Tests --no-restore --nologo

      - name: 集成测试
        run: dotnet test tests/ImgHub.Integration.Tests --no-restore --nologo

  # ---------------------------------------------------------------- Linux
  # 桌面 head 与 Android head 不在本 job 构建（前者需 win-x64 运行时，
  # 后者需 Android workload + SDK）；这里只验证跨平台的 Core / App / 测试。
  test-linux:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: |
          dotnet restore tests/ImgHub.Core.Tests
          dotnet restore tests/ImgHub.Integration.Tests

      - name: Core 单元测试
        run: dotnet test tests/ImgHub.Core.Tests --no-restore --nologo

      - name: 集成测试
        run: dotnet test tests/ImgHub.Integration.Tests --no-restore --nologo
