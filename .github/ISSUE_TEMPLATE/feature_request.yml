name: 功能建议
description: 提出一个新功能或改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 [`docs/FEATURES.md`](../blob/master/docs/FEATURES.md) 的
        「已知缺口」与「已实现但当前不可达」两节 —— 有些功能是**有意不做**的，
        不是遗漏。另见 [`docs/port-status.md`](../blob/master/docs/port-status.md) 的「下一步建议优先级」。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景与痛点，而不是直接给方案 —— 这样更容易找到更合适的实现方式。
      placeholder: 我经常……，但现在必须……，很麻烦。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案（可选）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - UI / 交互
        - 生图链路（provider / 参数 / 蒙版）
        - 历史与成本管理
        - 多语言
        - 构建与发布
        - 文档
        - 其它
    validations:
      required: true
