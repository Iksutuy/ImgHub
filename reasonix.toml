# Reasonix 项目级配置 —— 只对本仓库生效。
# 解析顺序：flag > ./reasonix.toml > ~/AppData/Roaming/reasonix/config.toml > 内置默认。
# 本文件只声明本项目需要的 MCP 服务器；模型/价格/权限等一律继承全局配置，
# 以免在本仓库里悄悄换掉模型或改写计费口径。
# 密钥不写在这里：用 api_key_env 指向 Reasonix 全局 .env。

config_version = 10

# External MCP servers. type: "stdio"（默认，子进程） | "http" | "sse"。
# ${VAR} / ${VAR:-default} 会在 command/args/env/url/headers 里从环境变量展开。

[[plugins]]
name    = "roslyn-codelens"
command = "roslyn-codelens-mcp"
# 相对路径：cwd 即仓库根，换机器/换盘符不会失效
args    = ["ImgHub.slnx"]
